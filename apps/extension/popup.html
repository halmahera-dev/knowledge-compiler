<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Knowledge Compiler</title>
    <style>
      /* Mirrors the web app's paper/ink tokens so the extension reads as the
         same product. Kept inline — one file, no build step. */
      :root {
        --paper: #faf9f6;
        --surface: #fff;
        --ink: #1a1815;
        --muted: #6b6560;
        --faint: #8c8681;
        --rule: #e5e1d8;
        --link: #2563eb;
        --added: #2f855a;
        --danger: #c53030;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #201e1b;
          --surface: #292724;
          --ink: #ece9e4;
          --muted: #a8a29b;
          --faint: #7e7871;
          --rule: #3a3733;
          --link: #7aa5f5;
          --added: #6ee7a8;
          --danger: #f08b84;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        background: var(--paper);
        color: var(--ink);
        font:
          14px/1.5 Inter,
          system-ui,
          sans-serif;
      }
      .eyebrow {
        font:
          500 10px/1 ui-monospace,
          monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--faint);
      }
      h1 {
        margin: 6px 0 0;
        font:
          600 17px/1.3 ui-serif,
          Georgia,
          serif;
      }
      .meta {
        margin: 4px 0 14px;
        font-size: 12px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      button {
        width: 100%;
        height: 40px;
        border: 0;
        border-radius: 5px;
        background: var(--ink);
        color: var(--paper);
        font: 500 14px Inter, system-ui, sans-serif;
        cursor: pointer;
        transition: opacity 140ms;
      }
      button:hover:not(:disabled) {
        opacity: 0.9;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 2px;
      }
      #status {
        margin: 12px 0 0;
        font-size: 12.5px;
        min-height: 1.2em;
      }
      #status.ok {
        color: var(--added);
      }
      #status.err {
        color: var(--danger);
      }
      a {
        color: var(--link);
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: baseline;
        justify-content: space-between;
        margin-top: 10px;
        font-size: 11.5px;
        color: var(--faint);
      }
      input {
        width: 100%;
        margin-top: 4px;
        padding: 7px 9px;
        border: 1px solid var(--rule);
        border-radius: 5px;
        background: var(--surface);
        color: var(--ink);
        font: 11.5px ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">Clip to knowledge base</p>
    <h1 id="title">Reading page…</h1>
    <p class="meta" id="meta"></p>

    <button id="save" disabled>Save and compile</button>
    <p id="status" role="status" aria-live="polite"></p>

    <div class="row">
      <label for="api">API</label>
      <span>compiles here</span>
    </div>
    <input id="api" type="url" spellcheck="false" />

    <div class="row">
      <label for="app">App</label>
      <!-- Named "signs in here" because that is the only thing this URL is for:
           the extension has no login and borrows the app's session. -->
      <span>signs in here</span>
    </div>
    <input id="app" type="url" spellcheck="false" />

    <script type="module" src="popup.js"></script>
  </body>
</html>
