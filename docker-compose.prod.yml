services:
  web:
    image: ghcr.io/${GH_OWNER}/kc-web:latest
    restart: always
    ports:
      - "3000:3000"
    env_file: .env

  api:
    image: ghcr.io/${GH_OWNER}/kc-api:latest
    restart: always
    ports:
      - "8000:8000"
    env_file: .env

  agent:
    image: ghcr.io/${GH_OWNER}/kc-agent:latest
    restart: always
    ports:
      - "4111:4111"
    env_file: .env

  worker:
    image: ghcr.io/${GH_OWNER}/kc-api:latest
    command: uv run arq app.worker.WorkerSettings
    restart: always
    env_file: .env
