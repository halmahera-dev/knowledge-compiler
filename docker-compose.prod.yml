services:
  # The Next app. Published on 3000 so the address
  # people already have keeps working; only the image behind it changed.
  #
  # NEXT_PUBLIC_* are absent from this file on purpose — they are compiled into
  # the browser bundle when the image is built, so setting them here would look
  # like configuration and do nothing. They come from the CI build args.
  client:
    image: ghcr.io/${GH_OWNER}/kc-client:latest
    restart: always
    ports:
      - "3000:3000"
    env_file: .env

  api:
    image: ghcr.io/${GH_OWNER}/kc-api:latest
    restart: always
    ports:
      - "8000:8000"
    env_file: .env

  agent:
    image: ghcr.io/${GH_OWNER}/kc-agent:latest
    restart: always
    ports:
      - "4111:4111"
    env_file: .env

  worker:
    image: ghcr.io/${GH_OWNER}/kc-api:latest
    command: uv run arq app.worker.WorkerSettings
    restart: always
    env_file: .env

  migrate:
    image: ghcr.io/${GH_OWNER}/kc-migrate:latest
    env_file: .env

