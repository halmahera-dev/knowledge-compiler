name: CI/CD Pipeline to AWS EC2

on:
  push:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Docker Images (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: client
            file: ./apps/client/Dockerfile
            image: kc-client
            # Baked into the browser bundle at build time, so they cannot be
            # supplied by compose later. The Dockerfile fails the build when
            # either is empty rather than shipping an image that sends every
            # visitor to their own machine. Set them under
            # Settings > Secrets and variables > Actions > Variables.
            build-args: |
              NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
              NEXT_PUBLIC_MASTRA_URL=${{ vars.PUBLIC_MASTRA_URL }}
          - service: api
            file: ./apps/api/Dockerfile
            image: kc-api
            build-args: ""
          - service: agent
            file: ./apps/agent/Dockerfile
            image: kc-agent
            build-args: ""
          - service: migrate
            file: ./Dockerfile.migrate
            image: kc-migrate
            build-args: ""

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 Support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-to-ec2:
    name: Deploy to AWS EC2 (t4g.small)
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/knowledge-compiler
            # Reset, not pull. The checkout exists only to supply the compose
            # file and the migration entrypoint — the code that runs comes from
            # the images. A `git pull` refuses to run when someone has edited a
            # tracked file on the box to test a fix, and it refuses *quietly
            # enough* that the deploy carries on against a checkout frozen at
            # whatever commit it was on. That happened: the server sat four
            # commits behind while every deploy reported success.
            #
            # .env is gitignored, so this does not touch it.
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd -e '.env*'
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export GH_OWNER="${{ github.repository_owner }}"
            COMPOSE="docker compose -f docker-compose.prod.yml"

            # One service at a time, cleaning up between.
            #
            # The box has a 19G disk and these images are ~2.9G each, because
            # each runner stage copies its whole build stage. Pulling all four
            # at once needs room for two full generations at the same time —
            # the old ones are still held by the running containers — and it
            # ran out partway through extracting a layer, which failed the
            # deploy and left the site on the previous release.
            #
            # Pulling one at a time never holds more than one image spare, and
            # each service is only down for its own recreate rather than for
            # the whole pull. `image prune -a` cannot touch an image a running
            # container holds, so the services not being replaced are safe.
            #
            # The real fix is smaller images; this makes the deploy fit the
            # disk we have.
            $COMPOSE pull migrate
            $COMPOSE run --rm migrate
            docker image prune -af || true

            for service in api agent client; do
              $COMPOSE pull "$service"
              if [ "$service" = "api" ]; then
                # Same image, so they are replaced together.
                $COMPOSE up -d --no-deps api worker
              else
                $COMPOSE up -d --no-deps "$service"
              fi
              docker image prune -af || true
            done

            $COMPOSE up -d --remove-orphans
            df -h / | tail -1
